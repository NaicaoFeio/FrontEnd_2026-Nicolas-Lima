<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Exercício 02 - Conversor</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        label { display: block; margin-top: 10px; }
        input { padding: 8px; font-size: 16px; }
    </style>
</head>
<body>
    <h3>Conversor de Temperatura</h3>
    
    <label>Graus Celsius (°C):</label>
    <input type="number" id="c" oninput="convC()" step="0.1">

    <label>Graus Fahrenheit (°F):</label>
    <input type="number" id="f" oninput="convF()" step="0.1">

    <script>
        function convC() {
            let c = document.getElementById('c').value;
            if (c === "") { document.getElementById('f').value = ""; return; }
            let f = (c * 9/5) + 32;
            document.getElementById('f').value = f.toFixed(2);
        }

        function convF() {
            let f = document.getElementById('f').value;
            if (f === "") { document.getElementById('c').value = ""; return; }
            let c = (f - 32) * 5/9;
            document.getElementById('c').value = c.toFixed(2);
        }
    </script>
</body>
</html>
